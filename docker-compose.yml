version: '3.4'

services:
  backend:
    build:
      context: ./
      dockerfile: ./docker/backend/Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8241
    env_file:
      - ./.env.example
    networks:
      - pdnr-network
    volumes:
      - ./storage:/code/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8241/health/"]
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      - redis
  celery-worker:
    build:
      context: ./
      dockerfile: ./docker/backend/Dockerfile
    command: uv run python -m celery --app=PDNR.celery.celery worker --loglevel=info --max-memory-per-child=10000 --without-gossip --without-mingle --without-heartbeat -E -B
    networks:
      - pdnr-network
    env_file:
      - ./.env.example
    environment:
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./storage:/code/storage
      - ./docker/celery/log:/var/log/celery
    restart: unless-stopped
    depends_on:
      - backend
      - redis
  redis:
    build:
      context: ./
      dockerfile: ./docker/redis/Dockerfile
    volumes:
      - ./docker/redis/log/:/var/log/redis/
    restart: unless-stopped
    healthcheck:
      interval: 2s
      retries: 5
      start_period: 10s
      test:
        "cmd redis-cli ping"
      timeout: 3s
    networks:
      - pdnr-network
  flower:
    build:
      context: ./
      dockerfile: ./docker/backend/Dockerfile
    command: uv run celery flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - pdnr-network
    env_file:
      - ./.env.example
    depends_on:
      - redis
      - backend
      - celery-worker
  clickhouse:
    build:
      context: ./
      dockerfile: ./docker/clickhouse/Dockerfile
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - pdnr-network
    restart: unless-stopped
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USER=pdnr_user
      - CLICKHOUSE_PASSWORD=pdnr_password
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
networks:
  pdnr-network:
